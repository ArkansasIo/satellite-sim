services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-root-password
      MYSQL_DATABASE: satellite_ground
      MYSQL_USER: satellite_app
      MYSQL_PASSWORD: change-app-password
    ports:
      - "3306:3306"
    volumes:
      - satellite_mysql:/var/lib/mysql
      - ./../mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  satellite_mysql:
